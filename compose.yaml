services:
  ai_webapi:
    container_name: ai_webapi
    image: ai_webapi:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5043:8080"
    env_file:
      - .env.ai_webapi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
    volumes:
      - ai_webapi_report_artifacts:/app/data/patient-reports
      - ai_webapi_hospital_report_artifacts:/app/data/hospital-operation-reports
    networks:
      - mysql_net

networks:
  mysql_net:
    external: true
    name: mysql_default

volumes:
  ai_webapi_report_artifacts:
    external: true
    name: ai_webapi_report_artifacts
  ai_webapi_hospital_report_artifacts:
    external: true
    name: ai_webapi_hospital_report_artifacts
