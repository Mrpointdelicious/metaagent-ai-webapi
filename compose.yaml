services:
  ai_webapi:
    container_name: ai_webapi
    image: ai_webapi:${AI_WEBAPI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_IMAGE: ${AI_WEBAPI_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet:6.0}
        INSTALL_RUNTIME_DEPENDENCIES: ${AI_WEBAPI_INSTALL_RUNTIME_DEPENDENCIES:-true}
    restart: unless-stopped
    ports:
      - "${AI_WEBAPI_PORT:-5043}:8080"
    env_file:
      - .env.ai_webapi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PatientAccess__RequireIdentityProof: "true"
      TZ: Asia/Shanghai
    volumes:
      - ai_webapi_report_artifacts:/app/data/patient-reports
      - ai_webapi_hospital_report_artifacts:/app/data/hospital-operation-reports
    networks:
      - mysql_net

networks:
  mysql_net:
    external: true
    name: mysql_default

volumes:
  ai_webapi_report_artifacts:
    external: true
    name: ai_webapi_report_artifacts
  ai_webapi_hospital_report_artifacts:
    external: true
    name: ai_webapi_hospital_report_artifacts
