services:
  ai-webapi:
    container_name: ai-webapi
    image: ai-webapi:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5043:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
